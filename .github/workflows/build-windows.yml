name: Build Multi-Platform

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [created]

jobs:
  # ========== WINDOWS ==========
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyinstaller
      - name: Build executable
        run: pyinstaller --onefile --windowed --name AutoEmail desktop_app.py
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: AutoEmail-Windows
          path: dist/AutoEmail.exe
      - name: Release Windows
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoEmail.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========== DEBIAN/UBUNTU ==========
  build-debian:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev dpkg-dev
      - name: Install Python dependencies
        run: pip install pyinstaller
      - name: Build executable (Linux)
        run: pyinstaller --onefile --name AutoEmail desktop_app.py
      - name: Create .deb package
        run: |
          mkdir -p deb-package/usr/local/bin
          mkdir -p deb-package/usr/share/applications
          mkdir -p deb-package/DEBIAN
          cp dist/AutoEmail deb-package/usr/local/bin/
          cat > deb-package/usr/share/applications/autoemail.desktop << 'EOF'
          [Desktop Entry]
          Name=AutoEmail
          Comment=Envio automático de e-mails
          Exec=AutoEmail
          Icon=autoemail
          Terminal=false
          Type=Application
          Categories=Office;Email;
          EOF
          cat > deb-package/DEBIAN/control << 'EOF'
          Package: autoemail
          Version: 1.0.0
          Section: office
          Priority: optional
          Architecture: amd64
          Depends: python3, python3-tk
          Maintainer: Juan Moreno
          Description: AutoEmail - Automação de envio de e-mails
           Interface gráfica para envio automatizado de e-mails em massa
           com suporte a CSV, templates e anexos.
          EOF
          dpkg-deb --build deb-package autoemail_1.0.0_amd64.deb
      - name: Upload artifact (binário Linux)
        uses: actions/upload-artifact@v5
        with:
          name: AutoEmail-Linux
          path: dist/AutoEmail
      - name: Upload artifact (.deb)
        uses: actions/upload-artifact@v5
        with:
          name: AutoEmail-Debian-Package
          path: autoemail_1.0.0_amd64.deb
      - name: Release Linux
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AutoEmail
            autoemail_1.0.0_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
